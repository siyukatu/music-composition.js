<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — music-composition.js</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ground: #E7E9ED; --ink: #15171C; --muted: #5A616E; --accent: #F2541B; --accent-ink: #FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #111216; --ink: #ECEEF2; --muted: #969CA8; --accent: #FF6A33; --accent-ink: #1A0B04; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; padding-inline: 16px; }
  main { max-width: 32rem; }
  .code { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.7; }
  a { display: inline-block; margin-top: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-weight: 700; padding: 11px 16px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <p class="code">404 Not Found</p>
  <h1>ページが見つかりません</h1>
  <p>URL が間違っているか、ページが移動した可能性があります。</p>
  <a href="/">music-composition.js のトップへ</a>
</main>
</body>
</html>
